<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>📸 IG 媒體極速提取器</title>
    <style>
        :root {
            --bg-dark: #121318;
            --bg-card: #1C1E26;
            --text-main: #F8FAFC;
            --text-muted: #94A3B8;
            --ig-grad: linear-gradient(45deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%);
            --primary: #E1306C;
            --secondary: #833AB4;
            --success: #10B981;
            --border: rgba(255, 255, 255, 0.08);
        }

        * {
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-dark);
            background-image: 
                radial-gradient(circle at 10% 10%, rgba(131, 58, 180, 0.15), transparent 35%),
                radial-gradient(circle at 90% 80%, rgba(225, 48, 108, 0.12), transparent 35%);
            color: var(--text-main);
            margin: 0;
            padding: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 440px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            padding-bottom: 40px;
        }

        .header {
            text-align: center;
            margin: 8px 0 4px 0;
        }
        .header h2 {
            font-size: 24px;
            margin: 0 0 6px 0;
            background: var(--ig-grad);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 800;
            letter-spacing: 0.5px;
        }
        .header p {
            color: var(--text-muted);
            font-size: 13px;
            margin: 0;
        }

        /* 輸入區卡片 */
        .card {
            background: var(--bg-card);
            border-radius: 18px;
            padding: 18px;
            border: 1px solid var(--border);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }

        .input-wrapper {
            display: flex;
            gap: 8px;
            margin-bottom: 12px;
        }

        .url-input {
            flex: 1;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.12);
            color: var(--text-main);
            padding: 14px 12px;
            border-radius: 12px;
            font-size: 14px;
            outline: none;
            transition: border 0.2s;
        }
        .url-input:focus {
            border-color: var(--primary);
        }

        .paste-btn {
            background: rgba(255, 255, 255, 0.08);
            color: var(--text-main);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 0 14px;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
            white-space: nowrap;
            transition: 0.2s;
        }
        .paste-btn:active { transform: scale(0.95); }

        .submit-btn {
            width: 100%;
            background: var(--ig-grad);
            color: #fff;
            border: none;
            padding: 15px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(225, 48, 108, 0.3);
            transition: transform 0.1s;
        }
        .submit-btn:active { transform: scale(0.98); }

        /* 狀態與結果區 */
        #resultArea {
            display: none;
            flex-direction: column;
            gap: 16px;
        }

        .shortcode-badge {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(225, 48, 108, 0.1);
            border: 1px solid rgba(225, 48, 108, 0.3);
            padding: 10px 14px;
            border-radius: 10px;
            font-size: 13px;
        }
        .shortcode-badge span { color: #F472B6; font-weight: bold; font-family: monospace; }

        .section-label {
            font-size: 13px;
            color: var(--text-muted);
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        /* 多圖/第幾張選擇器 */
        .slide-selector {
            display: flex;
            gap: 6px;
            overflow-x: auto;
            padding-bottom: 6px;
            margin-bottom: 12px;
        }
        .slide-btn {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid var(--border);
            color: var(--text-muted);
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
            flex-shrink: 0;
        }
        .slide-btn.active {
            background: var(--primary);
            color: #fff;
            border-color: var(--primary);
        }

        /* 媒體預覽框 */
        .media-viewer {
            width: 100%;
            min-height: 220px;
            background: rgba(0, 0, 0, 0.4);
            border-radius: 12px;
            border: 1px dashed rgba(255, 255, 255, 0.15);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
            margin-bottom: 12px;
        }
        .media-viewer img, .media-viewer video {
            max-width: 100%;
            max-height: 420px;
            border-radius: 8px;
            display: block;
        }
        .viewer-placeholder {
            padding: 20px;
            text-align: center;
            color: var(--text-muted);
            font-size: 13px;
            line-height: 1.5;
        }

        /* 下載通道按鈕群 */
        .action-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }
        .dl-btn {
            background: rgba(255, 255, 255, 0.07);
            border: 1px solid var(--border);
            color: var(--text-main);
            padding: 13px 10px;
            border-radius: 12px;
            font-size: 13px;
            font-weight: bold;
            text-align: center;
            text-decoration: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            transition: background 0.2s;
        }
        .dl-btn:active { background: rgba(255, 255, 255, 0.15); }
        .dl-btn.video-btn {
            background: rgba(16, 185, 129, 0.15);
            border-color: rgba(16, 185, 129, 0.4);
            color: #34D399;
        }

            background: rgba(56, 189, 248, 0.15);
            border-color: rgba(56, 189, 248, 0.4);
            color: #
